<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rent Accounts</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4F46E5">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --paper:#F8FAFC; --card:#FFFFFF; --ink:#111827; --ink-soft:#6B7280; --line:#E5E7EB;
  --primary:#4F46E5; --accent:#4F46E5; --success:#16A34A; --warning:#F59E0B; --danger:#DC2626;
  --green:#16A34A; --red:#DC2626; --input-bg:#FFFFFF;
  --shadow:0 1px 2px rgba(17,24,39,.06),0 1px 8px rgba(17,24,39,.04);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --paper:#0B1220; --card:#151E32; --ink:#F1F5F9; --ink-soft:#94A3B8; --line:#26324A;
  --primary:#6366F1; --accent:#818CF8; --success:#4ADE80; --warning:#FBBF24; --danger:#F87171;
  --green:#4ADE80; --red:#F87171; --input-bg:#0B1220; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:relative;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
header p{margin:2px 0 0;color:var(--ink-soft);font-size:12.5px}
.themebtn{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:17px;cursor:pointer;line-height:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 14px 0;background:var(--paper);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:none;padding:10px 8px 11px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.active{color:var(--accent);border-bottom-color:var(--primary)}
main{padding:16px 16px 96px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{font-size:10.5px;color:var(--ink-soft);border:1px solid var(--line);padding:2px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;padding:4px 0;color:var(--ink-soft)}
.row b{color:var(--ink);font-weight:500;text-align:right}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.pos{color:var(--success)!important} .neg{color:var(--danger)!important} .warn{color:var(--warning)!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--input-bg);color:var(--ink);font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}
input[type=checkbox]{width:auto}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
.btn{display:inline-block;margin:14px 6px 0 0;background:var(--primary);color:#fff;border:1px solid var(--primary);padding:10px 16px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--primary)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.mini{background:none;border:1px solid var(--line);color:var(--accent);border-radius:6px;padding:2px 8px;font:inherit;font-size:11px;font-weight:600;margin-left:8px;cursor:pointer}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--primary);color:#fff;border:none;width:54px;height:54px;border-radius:50%;font-size:28px;box-shadow:0 4px 12px rgba(79,70,229,.4);cursor:pointer}
.empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:26px 10px;line-height:1.5}
.hint{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:4px 0 8px}
.divider{border:none;border-top:1px solid var(--line);margin:10px 0}
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:flex-end;z-index:20}
.modal-bg.open{display:flex}
.modal{background:var(--card);color:var(--ink);width:100%;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px 28px}
.modal h2{margin:0 0 4px;font-size:18px}
.close{float:right;background:none;border:none;font-size:24px;line-height:1;color:var(--ink-soft);cursor:pointer}
.entryline{border-bottom:1px solid var(--line);padding:8px 0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin:6px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#printArea{display:none}
@media print{
  html,body{height:auto}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;background:#fff;font-family:system-ui,sans-serif;padding:8px}
  #printArea table{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:12px}
  #printArea th,#printArea td{border:1px solid #999;padding:4px 6px;text-align:left}
}
</style>
<script src="./xlsx.full.min.js"></script>
</head>
<body>
<header>
  <h1>Rent Accounts</h1>
  <p id="subtitle">rent · electricity · repairs</p>
  <button class="themebtn" id="themeBtn" onclick="toggleTheme()" aria-label="Switch light or dark mode"></button>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<button class="fab" id="fab">+</button>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
const KEY='kirayakhata_v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || seed(); }catch(e){ return seed(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function seed(){ return { houses:[], rooms:[], tenants:[], entries:[], expenses:[], elecBills:[], elecReceipts:[], settings:{autoBackupEnabled:false,lastBackupDate:null} }; }
let DB = load();
DB.settings = DB.settings || {autoBackupEnabled:false, lastBackupDate:null};
DB.fundAdds = DB.fundAdds || []; DB.elecBills = DB.elecBills || []; DB.elecReceipts = DB.elecReceipts || [];
if(!DB.settings.theme) DB.settings.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

let tab = 'dash';
const tabsDef = [['dash','Dashboard'],['tenants','Tenants'],['electricity','Electricity'],['reports','Reports'],['fund','Repair Fund'],['archive','Archive'],['setup','Houses'],['names','Edit Names'],['backup','Backup'],['account','Account']];

// ---------- Google Sign-In + Drive sync ----------
// Replace with your own OAuth Client ID from Google Cloud Console (see setup guide).
const GOOGLE_CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com';
const DRIVE_FILE_NAME = 'rent-accounts-backup.json';
let driveToken = null, driveUser = null, driveFileId = null, tokenClient = null;

function initGoogle(){
  if(!window.google || !google.accounts || GOOGLE_CLIENT_ID.startsWith('YOUR_CLIENT_ID')) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.appdata email profile openid',
    callback: async (resp) => {
      if(resp.error){ return; }
      driveToken = resp.access_token;
      const info = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer '+driveToken}}).then(r=>r.json()).catch(()=>null);
      driveUser = info || {email:'signed in'};
      await checkDriveOnSignIn();
      render();
    }
  });
}
function driveSignIn(){
  if(!tokenClient){ initGoogle(); }
  if(!tokenClient){
    openModal(`<button class="close" onclick="closeModal()">×</button><h2>Not configured</h2><p style="font-size:13px;color:var(--red)">Google Sign-In needs a Client ID set up first — see the setup guide that came with this app.</p>`);
    return;
  }
  tokenClient.requestAccessToken({prompt:'consent'});
}
function driveSignOut(){
  if(driveToken) google.accounts.oauth2.revoke(driveToken, ()=>{});
  driveToken = null; driveUser = null; driveFileId = null;
  render();
}
async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}'`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name)`, {headers:{Authorization:'Bearer '+driveToken}}).then(r=>r.json());
  return (res.files && res.files[0]) ? res.files[0].id : null;
}
async function checkDriveOnSignIn(){
  driveFileId = await driveFindFile();
  if(driveFileId){
    const content = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {headers:{Authorization:'Bearer '+driveToken}}).then(r=>r.text());
    openModal(`<button class="close" onclick="closeModal()">×</button><h2>Data found in Drive</h2>
      <p style="font-size:13px;color:var(--ink-soft)">There's a backup in ${driveUser.email}'s Drive. Load it onto this device? This replaces what's currently here.</p>
      <button class="btn danger" onclick='loadFromDriveConfirmed(${JSON.stringify(content)})'>Load it</button>
      <button class="btn ghost" onclick="closeModal()">Not now — keep this device's data</button>`);
  }
}
function loadFromDriveConfirmed(content){
  try{
    const parsed = JSON.parse(content);
    DB = parsed;
    DB.settings = DB.settings || {autoBackupEnabled:false, lastBackupDate:null};
    DB.elecBills = DB.elecBills || []; DB.elecReceipts = DB.elecReceipts || [];
    save(); closeModal(); tab='dash'; render();
  }catch(e){}
}
async function saveToDrive(){
  if(!driveToken){ driveSignIn(); return; }
  const data = JSON.stringify(DB, null, 2);
  if(!driveFileId) driveFileId = await driveFindFile();
  if(driveFileId){
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
      method:'PATCH', headers:{Authorization:'Bearer '+driveToken, 'Content-Type':'application/json'}, body:data
    });
  } else {
    const boundary = 'ratboundary';
    const meta = JSON.stringify({name:DRIVE_FILE_NAME, parents:['appDataFolder']});
    const body = `--${boundary}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${boundary}--`;
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method:'POST', headers:{Authorization:'Bearer '+driveToken, 'Content-Type':`multipart/related; boundary=${boundary}`}, body
    }).then(r=>r.json());
    driveFileId = res.id;
  }
  render();
}
function renderAccount(){
  if(GOOGLE_CLIENT_ID.startsWith('YOUR_CLIENT_ID')){
    return `<div class="card"><h3>Google Sign-In</h3>
      <p style="font-size:13px;color:var(--ink-soft)">Not set up yet. Follow the setup guide (setup-google-drive.md) that came with this app to create a free Google Cloud OAuth Client ID, then paste it into GOOGLE_CLIENT_ID near the top of the script in index.html.</p>
    </div>`;
  }
  if(!driveUser){
    return `<div class="card"><h3>Google Sign-In</h3>
      <p style="font-size:13px;color:var(--ink-soft)">Sign in to load your data on this device, or push what's on this device to your Drive so other devices can pull it.</p>
      <button class="btn" onclick="driveSignIn()">Sign in with Google</button>
    </div>`;
  }
  return `<div class="card"><h3>Signed in</h3>
    <div class="row"><span>Account</span><b>${driveUser.email||''}</b></div>
    <button class="btn" style="margin-top:10px" onclick="saveToDrive()">Save this device's data to Drive</button><br>
    <button class="btn ghost" onclick="checkDriveOnSignIn()">Check Drive for newer data</button><br>
    <button class="btn ghost" onclick="driveSignOut()">Sign out</button>
  </div>
  <div class="empty">Data is stored in a private file only this app can see in your Drive — it won't show up in your regular Drive folder list.</div>`;
}
window.addEventListener('load', ()=>{ setTimeout(initGoogle, 300); });
if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
let reportFilter = {houseId:'', from:'', to:''};

function render(){
  DB.fundAdds = DB.fundAdds||[];
  const nav = document.getElementById('tabs');
  const mainTabs=tabsDef.slice(0,3), menuTabs=tabsDef.slice(3), inMenu=menuTabs.some(t=>t[0]===tab);
  nav.innerHTML = `<button id="burger" style="font-size:18px;padding:8px 10px 9px" class="${inMenu?'active':''}" aria-label="Menu">☰${inMenu?' <span style="font-size:13px">'+menuTabs.find(t=>t[0]===tab)[1]+'</span>':''}</button>`
    + mainTabs.map(([id,label])=>`<button data-t="${id}" class="${tab===id?'active':''}">${label}</button>`).join('');
  nav.querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  document.getElementById('burger').onclick=()=>openModal(`<button class="close" onclick="closeModal()">×</button><h2>Menu</h2>`
    + menuTabs.map(([id,label])=>`<button class="btn ${tab===id?'':'ghost'}" style="display:block;width:100%;margin:8px 0 0;text-align:left" onclick="tab='${id}';closeModal();render()">${label}</button>`).join(''));
  const m = document.getElementById('main');
  if(tab==='dash') m.innerHTML = renderDash();
  if(tab==='tenants') m.innerHTML = renderTenants();
  if(tab==='electricity') m.innerHTML = renderElectricity();
  if(tab==='reports') m.innerHTML = renderReports();
  if(tab==='fund') m.innerHTML = renderFund();
  if(tab==='archive') m.innerHTML = renderArchive();
  if(tab==='setup') m.innerHTML = renderSetup();
  if(tab==='names') m.innerHTML = renderNames();
  if(tab==='backup') m.innerHTML = renderBackup();
  if(tab==='account') m.innerHTML = renderAccount();
  document.getElementById('fab').onclick = ()=> {
    if(tab==='setup') openHouseModal();
    else if(tab==='fund') openExpenseModal();
    else if(tab==='electricity') openElecPickerModal();
    else openTenantModal();
  };
  document.getElementById('fab').style.display = (tab==='archive'||tab==='names'||tab==='backup'||tab==='reports'||tab==='account') ? 'none' : 'block';
  wireRowClicks();
}

function activeTenants(){ return DB.tenants.filter(t=>t.status!=='vacated'); }
function roomName(id){ const r=DB.rooms.find(x=>x.id===id); return r?r.name:'—'; }
function houseOfRoom(id){ const r=DB.rooms.find(x=>x.id===id); return r?r.houseId:null; }
function houseName(id){ const h=DB.houses.find(x=>x.id===id); return h?h.name:'—'; }
function tenantEntries(tid){ return DB.entries.filter(e=>e.tenantId===tid).sort((a,b)=>b.date.localeCompare(a.date)); }

function tenantElecReceipts(tid){ return (DB.elecReceipts||[]).filter(x=>x.tenantId===tid).sort((a,b)=>b.date.localeCompare(a.date)); }

function houseElecTotals(houseId){
  const bills = (DB.elecBills||[]).filter(b=>b.houseId===houseId);
  const receipts = (DB.elecReceipts||[]).filter(x=>x.houseId===houseId);
  const billed = bills.reduce((s,b)=>s+Number(b.amount),0);
  const received = receipts.reduce((s,b)=>s+Number(b.amount),0);
  return { billed, received, profit: received-billed };
}

// ---------- theme ----------
function applyTheme(){
  const t = DB.settings.theme === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  const b = document.getElementById('themeBtn'); if(b) b.textContent = t === 'dark' ? '☀️' : '🌙';
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', t === 'dark' ? '#0B1220' : '#4F46E5');
}
function toggleTheme(){
  DB.settings.theme = DB.settings.theme === 'dark' ? 'light' : 'dark';
  save(); applyTheme();
}

// ---------- fix mistakes: edit / delete any entry ----------
const REC = {
  rent:       {arr:()=>DB.entries,      title:'rent entry',          f:[['month','Month','text'],['date','Date received','date'],['rent','Rent (₹)','number']]},
  elecReceipt:{arr:()=>DB.elecReceipts, title:'electricity payment', f:[['date','Date received','date'],['amount','Amount (₹)','number']]},
  elecBill:   {arr:()=>DB.elecBills,    title:'electricity bill',    f:[['date','Bill date','date'],['units','Units','number'],['amount','Bill amount (₹)','number']]},
  fundAdd:    {arr:()=>DB.fundAdds,     title:'repair fund amount', f:[['date','Date','date'],['note','Note','text'],['amount','Amount (₹)','number']]},
  expense:    {arr:()=>DB.expenses,     title:'repair expense',      f:[['date','Date','date'],['particular','Particular','text'],['amount','Amount (₹)','number']]}
};
function openEditRecord(kind, id, back){
  const k = REC[kind], r = k.arr().find(x=>x.id===id); if(!r) return;
  const esc = v => String(v==null?'':v).replace(/"/g,'&quot;');
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>Edit ${k.title}</h2>`
    + k.f.map(([key,label,type])=>`<label>${label}</label><input id="rec_${key}" type="${type}" value="${esc(r[key])}">`).join('')
    + `<button class="btn" onclick="saveRecord('${kind}','${id}','${back||''}')">Save changes</button>
       <button class="btn danger" onclick="confirmDeleteRecord('${kind}','${id}','${back||''}')">Delete</button>`);
}
function saveRecord(kind, id, back){
  const k = REC[kind], r = k.arr().find(x=>x.id===id); if(!r) return;
  k.f.forEach(([key,,type])=>{ const v = document.getElementById('rec_'+key).value; r[key] = type==='number' ? Number(v||0) : v; });
  save(); afterRecordChange(back);
}
function confirmDeleteRecord(kind, id, back){
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>Delete this ${REC[kind].title}?</h2>
    <p class="hint" style="color:var(--danger)">It is removed permanently and all totals update.</p>
    <button class="btn danger" onclick="deleteRecord('${kind}','${id}','${back||''}')">Yes, delete</button>
    <button class="btn ghost" onclick="openEditRecord('${kind}','${id}','${back||''}')">Cancel</button>`);
}
function deleteRecord(kind, id, back){
  const arr = REC[kind].arr(), i = arr.findIndex(x=>x.id===id);
  if(i > -1) arr.splice(i, 1);
  save(); afterRecordChange(back);
}
function afterRecordChange(back){ render(); if(back) openTenantDetail(back); else closeModal(); }

// ---------- monthly earnings bar chart ----------
const inr = n => '₹'+Number(n||0).toLocaleString('en-IN');
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ym(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function defChart(){ const n=new Date(); return {from:ym(new Date(n.getFullYear(),n.getMonth()-11,1)), to:ym(n)}; }
let chartF = defChart();
let dashF = {from:'', to:''};
function inP(d,f){ return (!f.from && !f.to) ? true : inRange(d,f.from,f.to); }
function setChart(){
  const a=document.getElementById('cFrom').value, b=document.getElementById('cTo').value;
  if(a) chartF.from=a; if(b) chartF.to=b; render();
}
function resetChart(){ chartF=defChart(); render(); }
function renderChart(){
  let a=chartF.from, b=chartF.to; if(a>b){ const t=a; a=b; b=t; }
  const keys=[]; let y=+a.slice(0,4), m=+a.slice(5)-1;
  while((y+'-'+String(m+1).padStart(2,'0'))<=b && keys.length<240){ keys.push(y+'-'+String(m+1).padStart(2,'0')); m++; if(m>11){m=0;y++;} }
  const rent={}, elec={}; keys.forEach(k=>{rent[k]=0;elec[k]=0;});
  DB.entries.forEach(e=>{ const k=(e.date||'').slice(0,7); if(k in rent) rent[k]+=Number(e.rent||0); });
  (DB.elecReceipts||[]).forEach(x=>{ const k=(x.date||'').slice(0,7); if(k in elec) elec[k]+=Number(x.amount||0); });
  const n=keys.length, max=Math.max(1,...keys.map(k=>rent[k]+elec[k])), H=130;
  const fmt=v=>v>=1000?(Math.round(v/100)/10)+'k':String(v);
  const tr=keys.reduce((s,k)=>s+rent[k],0), te=keys.reduce((s,k)=>s+elec[k],0);
  const bars=keys.map(k=>{ const r=rent[k], el=elec[k], tot=r+el;
    return `<div style="flex:1 0 32px;display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="font-size:10px;font-weight:600;height:13px">${tot?fmt(tot):''}</div>
      <div style="height:${H}px;width:100%;max-width:30px;display:flex;flex-direction:column;justify-content:flex-end">
        <div style="height:${Math.round(el/max*H)}px;background:var(--success);border-radius:4px 4px 0 0"></div>
        <div style="height:${Math.round(r/max*H)}px;background:var(--primary);${el?'':'border-radius:4px 4px 0 0'}"></div></div>
      <div style="font-size:10.5px;color:var(--ink-soft);white-space:nowrap">${MN[+k.slice(5)-1]}${n>12?' '+k.slice(2,4):''}</div></div>`; }).join('');
  return `<div class="card"><h3>Monthly earnings <span class="tag">${n} month${n!==1?'s':''}</span></h3>
    <div class="grid2"><div><label style="margin-top:0">From month</label><input id="cFrom" type="month" value="${a}" onchange="setChart()"></div>
    <div><label style="margin-top:0">To month</label><input id="cTo" type="month" value="${b}" onchange="setChart()"></div></div>

function fundAddSum(hid,f){ return (DB.fundAdds||[]).filter(x=>(!hid||x.houseId===hid)&&inP(x.date,f)).reduce((s,x)=>s+Number(x.amount||0),0); }
function houseP(hid,f){
  const billed=(DB.elecBills||[]).filter(b=>b.houseId===hid&&inP(b.date,f)).reduce((s,b)=>s+Number(b.amount),0);

function tenantExcel(tid){

  if(!window.XLSX){ notice('Excel not ready','The Excel component has not loaded yet. Wait a moment and try again.'); return; }
  const es=tenantEntries(tid), el=tenantElecReceipts(tid);
  const tr=es.reduce((s,e)=>s+Number(e.rent||0),0), te=el.reduce((s,e)=>s+Number(e.amount||0),0);
  const wb=XLSX.utils.book_new();
  const add=(n,h,rows)=>{ const ws=XLSX.utils.json_to_sheet(rows,{header:h}); ws['!cols']=h.map(x=>({wch:Math.max(14,x.length+2)})); XLSX.utils.book_append_sheet(wb,ws,n); };

// ---------- files ----------
function backupName(ext){ return 'rent-accounts-backup-'+new Date().toISOString().slice(0,10)+'.'+ext; }
async function saveBlob(filename, blob){
  try{
    if(typeof claude!=='undefined' && claude.use && blob.type.indexOf('json')>-1){
      const d = await claude.use('downloads');
      if(d){ await d.save({filename, data: await blob.text()}); return; }
    }
  }catch(e){}
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 5000);
}
function exportJSON(){
  saveBlob(backupName('json'), new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'}));
}
async function shareBackup(){
  const text = JSON.stringify(DB, null, 2);
  try{
    const file = new File([text], backupName('json'), {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Rent Accounts backup'});
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  exportJSON();
  notice('Downloaded instead', "Sharing isn't available here, so the backup was saved to your Downloads folder. Upload it to Drive from there.");
}
function exportExcel(){
  if(typeof claude!=='undefined'){ notice('Use the installed app','Excel download works in the installed Rent Accounts app. This preview page cannot save Excel files.'); return; }
  if(!window.XLSX){ notice('Excel not ready','The Excel component has not loaded yet. Wait a moment and try again, or use the .json backup.'); return; }
  const tn = id => DB.tenants.find(x=>x.id===id) || {};
  const sheets = [
    ['Tenants', ['Serial','Name','House','Room','Status','Phone','Security','Rent due','Move in','Move out','Notes'],
      DB.tenants.map(t=>({Serial:t.serial||'',Name:t.name,House:houseName(houseOfRoom(t.roomId)),Room:roomName(t.roomId),Status:t.status==='vacated'?'Vacated':'Active',Phone:t.phone||'',Security:Number(t.security||0),'Rent due':t.dueDay||'','Move in':t.moveIn||'','Move out':t.moveOut||'',Notes:t.notes||''}))],
    ['Rent', ['Serial','Tenant','House','Room','Month','Date','Rent'],
      DB.entries.map(e=>{const t=tn(e.tenantId);return {Serial:t.serial||'',Tenant:t.name||'',House:t.roomId?houseName(houseOfRoom(t.roomId)):'',Room:t.roomId?roomName(t.roomId):'',Month:e.month||'',Date:e.date||'',Rent:Number(e.rent||0)};})],
    ['Electricity received', ['House','Tenant','Date','Amount'],
      (DB.elecReceipts||[]).map(x=>({House:houseName(x.houseId),Tenant:x.tenantName||'',Date:x.date||'',Amount:Number(x.amount||0)}))],
    ['Electricity bills', ['House','Date','Units','Bill amount','Per unit'],
      (DB.elecBills||[]).map(b=>({House:houseName(b.houseId),Date:b.date||'',Units:Number(b.units||0),'Bill amount':Number(b.amount||0),'Per unit':b.units?Math.round(b.amount/b.units*100)/100:''}))],
    ['Fund additions', ['House','Date','Note','Amount'],
      (DB.fundAdds||[]).map(x=>({House:houseName(x.houseId),Date:x.date||'',Note:x.note||'',Amount:Number(x.amount||0)}))],
    ['Repairs', ['House','Date','Particular','Amount'],
      DB.expenses.map(x=>({House:houseName(x.houseId),Date:x.date||'',Particular:x.particular||'',Amount:Number(x.amount||0)}))]
  ];
  const wb = XLSX.utils.book_new();
  sheets.forEach(([name, headers, rows])=>{
    const ws = XLSX.utils.json_to_sheet(rows, {header: headers});
    ws['!cols'] = headers.map(h=>({wch: Math.max(12, h.length+2)}));
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  saveBlob(backupName('xlsx'), new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
function exportPDF(){
  const tbl = (head, rows) => `<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
  let body = `<h1>Rent Accounts — Report</h1><p>${new Date().toLocaleDateString('en-IN')}</p>`;
  DB.houses.forEach(h=>{
    const {billed, received, profit} = houseElecTotals(h.id);
    body += `<h2>${h.name}</h2><p>Electricity: billed ₹${billed} · received ₹${received} · profit ₹${profit}</p>`;
    const roomIds = DB.rooms.filter(r=>r.houseId===h.id).map(r=>r.id);
    DB.tenants.filter(t=>roomIds.includes(t.roomId)).forEach(t=>{
      body += `<h3>${t.serial||''} ${t.name} (${roomName(t.roomId)}) — ${t.status==='vacated'?'vacated':'active'}</h3>`;
      body += tbl(['Month','Date','Rent'], tenantEntries(t.id).map(e=>[e.month||'', e.date||'', '₹'+e.rent]));
      const el = tenantElecReceipts(t.id);
      if(el.length) body += tbl(['Electricity paid on','Amount'], el.map(x=>[x.date||'', '₹'+x.amount]));
    });
    const exps = DB.expenses.filter(x=>x.houseId===h.id);
    if(exps.length) body += '<h3>Repairs</h3>' + tbl(['Date','Particular','Amount'], exps.map(x=>[x.date||'', x.particular||'', '₹'+x.amount]));
  });
  let area = document.getElementById('printArea');
  if(!area){ area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.innerHTML = body;
  window.print();
}

// ---------- restore ----------
let pendingImport = null;
function normalizeDB(d){
  ['houses','rooms','tenants','entries','expenses','elecBills','elecReceipts'].forEach(k=>{ if(!Array.isArray(d[k])) d[k] = []; });
  const theme = DB.settings.theme;
  d.settings = Object.assign({autoBackupEnabled:false, lastBackupDate:null}, d.settings || {});
  d.settings.theme = theme;
  return d;
}
function parseAndConfirmImport(text){
  let parsed = null;
  try{ parsed = JSON.parse(String(text).replace(/^\uFEFF/, '').trim()); }catch(e){}
  if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.houses)){
    notice('Not a backup file', 'This is not a Rent Accounts .json backup. Use the file made by <b>Download backup (.json)</b>. If you pasted text, make sure you copied all of it, from the first { to the last }.');
    return;
  }
  pendingImport = parsed;
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>Restore this backup?</h2>
    <p class="hint" style="color:var(--danger)">This replaces ALL current data with the file's data: ${parsed.houses.length} houses, ${(parsed.tenants||[]).length} tenants, ${(parsed.entries||[]).length} rent entries. This cannot be undone.</p>
    <button class="btn danger" onclick="confirmImport()">Yes, replace all data</button>
    <button class="btn ghost" onclick="closeModal()">Cancel</button>`);
}
function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(/\.(xlsx|xls|csv|pdf)$/i.test(file.name)){
    notice('That is a report, not a backup', 'Excel, CSV and PDF files are for reading only. To restore, choose the <b>.json backup</b>.');
    input.value = ''; return;
  }
  const reader = new FileReader();
  reader.onload = e => parseAndConfirmImport(e.target.result);
  reader.onerror = () => notice('Could not read the file', 'Try the paste option below instead.');
  reader.readAsText(file);
  input.value = '';
}
function importFromPastedText(){
  const text = document.getElementById('importText').value.trim();
  if(!text){ notice('Nothing pasted', 'Paste the backup text into the box first.'); return; }
  parseAndConfirmImport(text);
}
function confirmImport(){
  if(!pendingImport) return;
  DB = normalizeDB(pendingImport);
  pendingImport = null;
  save(); closeModal(); tab = 'dash'; applyTheme(); render();
}

// ---------- Modals ----------
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('modalBg').classList.add('open'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').onclick = e=>{ if(e.target.id==='modalBg') closeModal(); };

function openHouseModal(){
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New house</h2>
    <label>House name</label><input id="hName" placeholder="e.g. Chimni Mill">
    <label>Initial (short code for tenant serial numbers)</label><input id="hInitial" placeholder="e.g. CM">
    <button class="btn" onclick="saveHouse()">Save house</button>`);
}
function saveHouse(){
  const name = document.getElementById('hName').value.trim();
  if(!name) return;
  const initial = document.getElementById('hInitial').value.trim().toUpperCase() || name.slice(0,2).toUpperCase();
  DB.houses.push({id:uid(), name, initial, tenantCounter:0}); save(); closeModal(); render();
}

function openRoomModal(houseId){
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New room</h2>
    <label>Room name</label><input id="rName" placeholder="e.g. Window room">
    <button class="btn" onclick="saveRoom('${houseId}')">Save room</button>`);
}
function saveRoom(houseId){
  const name = document.getElementById('rName').value.trim();
  if(!name) return;
  DB.rooms.push({id:uid(), houseId, name}); save(); closeModal(); render();
}

function openTenantModal(){
  if(!DB.rooms.length){ openHouseModal(); return; }
  const roomOpts = DB.rooms.map(r=>`<option value="${r.id}">${r.name} — ${houseName(r.houseId)}</option>`).join('');
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New tenant</h2>
    <label>Name</label><input id="tName">
    <label>Room</label><select id="tRoom">${roomOpts}</select>
    <label>Security deposit (₹)</label><input id="tSecurity" type="number">
    <label>Rent due date</label><input id="tDue" placeholder="e.g. 1st of every month">
    <label>Move-in date</label><input id="tMoveIn" type="date">
    <button class="btn" onclick="saveTenant()">Save tenant</button>`);
}
function saveTenant(){
  const name=document.getElementById('tName').value.trim();
  if(!name) return;
  const roomId = document.getElementById('tRoom').value;
  const house = DB.houses.find(x=>x.id===houseOfRoom(roomId));
  house.tenantCounter = (house.tenantCounter||0) + 1;
  const serial = `${house.initial||'T'}-${house.tenantCounter}`;
  DB.tenants.push({id:uid(), serial, name, roomId,
    security:document.getElementById('tSecurity').value||0, dueDay:document.getElementById('tDue').value,
    moveIn:document.getElementById('tMoveIn').value, status:'active'});
  save(); closeModal(); render();
}

function openTenantDetail(tid){
  const t = DB.tenants.find(x=>x.id===tid);
  const es = tenantEntries(tid);
  const elecs = tenantElecReceipts(tid);
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>${t.name} <span class="tag">${t.serial||'—'}</span></h2>
    <p style="color:var(--ink-soft);font-family:'Space Mono',monospace;font-size:12px">${roomName(t.roomId)} · ${houseName(houseOfRoom(t.roomId))}${t.phone?' · '+t.phone:''}</p>
    <div class="row"><span>Security held</span><b class="num">₹${Number(t.security||0).toLocaleString('en-IN')}</b></div>
    ${t.notes? `<div class="row" style="display:block"><span>Notes</span><div style="margin-top:3px">${t.notes}</div></div>`:''}
    ${t.verificationLink? `<div class="row"><span>Verification</span><a href="${t.verificationLink}" target="_blank" style="color:var(--accent)">Open link</a></div>`:''}
    ${t.agreementLink? `<div class="row"><span>Rent agreement</span><a href="${t.agreementLink}" target="_blank" style="color:var(--accent)">Open link</a></div>`:''}
    <div style="margin-top:10px">
      <button class="btn" onclick="openRentModal('${tid}')">+ Add rent</button>
      <button class="btn ghost" onclick="openTenantElecModal('${tid}')">+ Add electricity payment</button><br>
      <button class="btn ghost" onclick="editTenant('${tid}')">Edit details / notes / links</button><br><button class="btn ghost" onclick="tenantExcel('${tid}')">Download Excel</button><button class="btn ghost" onclick="tenantPDF('${tid}')">Download PDF</button>
      ${t.status!=='vacated'? `<button class="btn ghost" onclick="openVacateModal('${tid}')">Mark vacated</button>`:''}
    </div>
    <hr class="divider">
    <h3 style="font-size:13px">Rent history</h3>
    ${es.map(e=>`<div class="entryline row"><span>${e.month} · ${e.date}</span><span><b class="num">₹${Number(e.rent).toLocaleString('en-IN')}</b><button class="mini" onclick="openEditRecord('rent','${e.id}','${tid}')">Edit</button></span></div>`).join('') || '<div class="empty">No rent entries yet.</div>'}
    <h3 style="font-size:13px;margin-top:14px">Electricity payments</h3>
    ${elecs.map(x=>`<div class="entryline row"><span>${x.date}</span><span><b class="num">₹${Number(x.amount).toLocaleString('en-IN')}</b><button class="mini" onclick="openEditRecord('elecReceipt','${x.id}','${tid}')">Edit</button></span></div>`).join('') || '<div class="empty">No electricity payments yet.</div>'}`);
}

function openRentModal(tid){
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New rent entry</h2>
    <label>Month (e.g. Sep 2026)</label><input id="eMonth">
    <label>Rent received date</label><input id="eDate" type="date">
    <label>Rent received (₹)</label><input id="eRent" type="number">
    <button class="btn" onclick="saveRentEntry('${tid}')">Save rent</button>`);
}
function saveRentEntry(tid){
  DB.entries.push({id:uid(), tenantId:tid, month:document.getElementById('eMonth').value,
    date:document.getElementById('eDate').value, rent:Number(document.getElementById('eRent').value||0)});
  save(); render(); openTenantDetail(tid);
}

function openTenantElecModal(tid){
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>Electricity payment</h2>
    <p style="font-size:12px;color:var(--ink-soft)">This logs into the house's Electricity tab automatically, tagged with ${DB.tenants.find(x=>x.id===tid).name}'s name.</p>
    <label>Date tenant paid</label><input id="teDate" type="date">
    <label>Amount received (₹)</label><input id="teAmount" type="number">
    <button class="btn" onclick="saveTenantElec('${tid}')">Save payment</button>`);
}
function saveTenantElec(tid){
  const t = DB.tenants.find(x=>x.id===tid);
  DB.elecReceipts = DB.elecReceipts||[];
  DB.elecReceipts.push({id:uid(), houseId:houseOfRoom(t.roomId), tenantId:tid, tenantName:t.name,
    date:document.getElementById('teDate').value, amount:Number(document.getElementById('teAmount').value||0)});
  save(); render(); openTenantDetail(tid);
}

function openVacateModal(tid){
  const t = DB.tenants.find(x=>x.id===tid);
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>Mark vacated</h2>
    <label>Move-out date</label><input id="vDate" type="date">
    <label>Security held (₹)</label><input id="vSecAmount" type="number" value="${t.security||0}">
    <label>How is the security settled?</label>
    <select id="vSecType">
      <option value="cash">Returned in cash / bank transfer</option>
      <option value="rent">Adjusted against rent</option>
      <option value="electricity">Adjusted against electricity</option>
      <option value="none">Nothing to settle (already handled)</option>
    </select>
    <button class="btn danger" onclick="vacate('${tid}')">Confirm — move to archive</button>`);
}
function vacate(tid){
  const t = DB.tenants.find(x=>x.id===tid);
  const moveOut = document.getElementById('vDate').value;
  const secType = document.getElementById('vSecType').value;
  const secAmount = Number(document.getElementById('vSecAmount').value||0);
  if(secAmount>0 && secType==='rent'){
    DB.entries.push({id:uid(), tenantId:tid, month:'Security adjustment', date:moveOut, rent:secAmount});
  } else if(secAmount>0 && secType==='electricity'){
    DB.elecReceipts = DB.elecReceipts||[];
    DB.elecReceipts.push({id:uid(), houseId:houseOfRoom(t.roomId), tenantId:tid, tenantName:t.name, date:moveOut, amount:secAmount});
  }
  t.securitySettlement = {type:secType, amount:secAmount, date:moveOut};
  t.status='vacated'; t.moveOut = moveOut;
  save(); closeModal(); tab='archive'; render();
}

function openExpenseModal(){
  if(!DB.houses.length){ openHouseModal(); return; }
  const opts = DB.houses.map(h=>`<option value="${h.id}">${h.name}</option>`).join('');
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New repair expense</h2>
    <label>House</label><select id="xHouse">${opts}</select>
    <label>Date</label><input id="xDate" type="date">
    <label>Particular</label><input id="xPart" placeholder="e.g. Water motor">
    <label>Amount (₹)</label><input id="xAmt" type="number">
    <button class="btn" onclick="saveExpense()">Save expense</button>`);
}
function saveExpense(){
  DB.expenses.push({id:uid(), houseId:document.getElementById('xHouse').value, date:document.getElementById('xDate').value,
    particular:document.getElementById('xPart').value, amount:Number(document.getElementById('xAmt').value||0)});
  save(); closeModal(); render();
}

applyTheme();
render();

function checkAutoBackup(){
  const s = DB.settings;
  if(!s || !s.autoBackupEnabled) return;
  const today = new Date().toISOString().slice(0,10);
  if(s.lastBackupDate === today) return;
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const wifiOk = (conn && conn.type) ? conn.type==='wifi' : true;
  if(!wifiOk) return;
  exportJSON();
  s.lastBackupDate = today;
  save();
}
checkAutoBackup();

// Swipe between tabs
(function(){
  const el = document.getElementById('main');
  let sx=0, sy=0;
  el.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5 && !document.getElementById('modalBg').classList.contains('open')){
      const i = tabsDef.findIndex(t=>t[0]===tab);
      if(dx < 0 && i < tabsDef.length-1){ tab = tabsDef[i+1][0]; render(); }
      if(dx > 0 && i > 0){ tab = tabsDef[i-1][0]; render(); }
    }
  }, {passive:true});
})();
</script>

if ('serviceWorker' in navigator) {

    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
