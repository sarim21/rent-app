<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rent Accounts</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#8C3B2E">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E4; --line:#D8CBA8; --ink:#241E17; --ink-soft:#6B6152;
  --red:#8C3B2E; --green:#3E6B4B; --card:#FFFDF6; --accent:#B4832A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;
  background-image:repeating-linear-gradient(var(--paper) 0 27px, var(--line) 27px 28px);
}
header{position:sticky;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;background:var(--paper);
  border-bottom:2px solid var(--ink); z-index:5;}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.3px}
header p{margin:2px 0 0;color:var(--ink-soft);font-size:12.5px;font-family:'Space Mono',monospace}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 18px 0;background:var(--paper);position:sticky;top:64px;z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;background:none;border:none;padding:8px 4px 10px;font-family:'Space Mono',monospace;font-size:12px;
  color:var(--ink-soft);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{padding:16px 16px 90px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px 16px;margin-bottom:12px;
  box-shadow:2px 2px 0 rgba(36,30,23,.05)}
.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.tag{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--ink-soft);border:1px solid var(--line);padding:2px 6px;border-radius:2px}
.row{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:13px;padding:3px 0;color:var(--ink-soft)}
.row b{color:var(--ink);font-weight:400}
.num{font-family:'Space Mono',monospace}
.pos{color:var(--green)} .neg{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:26px;font-weight:700;font-family:'Space Mono',monospace}
label{display:block;font-size:12px;color:var(--ink-soft);margin:10px 0 4px;font-family:'Space Mono',monospace}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:2px;background:#fff;
  font-family:'Space Mono',monospace;font-size:14px;color:var(--ink)}
.btn{display:inline-block;margin-top:14px;background:var(--ink);color:var(--paper);border:none;padding:11px 18px;
  border-radius:2px;font-family:'Space Mono',monospace;font-size:13px;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--ink);color:var(--ink)}
.btn.danger{background:var(--red)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;
  border:none;width:52px;height:52px;border-radius:50%;font-size:26px;box-shadow:0 3px 8px rgba(0,0,0,.25);cursor:pointer}
.empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:30px 10px;font-family:'Space Mono',monospace}
.divider{border:none;border-top:1px dashed var(--line);margin:10px 0}
.modal-bg{position:fixed;inset:0;background:rgba(36,30,23,.45);display:none;align-items:flex-end;z-index:20}
.modal-bg.open{display:flex}
.modal{background:var(--card);width:100%;max-height:88vh;overflow-y:auto;border-radius:12px 12px 0 0;padding:18px 18px 24px}
.modal h2{margin:0 0 4px;font-size:18px}
.close{float:right;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer}
.entryline{border-bottom:1px solid var(--line);padding:8px 0}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#1B1712;--card:#242019;--ink:#EDE6D6;--ink-soft:#9A8F79;--line:#3A3325;--card:#242019}
}
:root[data-theme="dark"]{--paper:#1B1712;--card:#242019;--ink:#EDE6D6;--ink-soft:#9A8F79;--line:#3A3325}
</style>
</head>
<body>
<header>
  <h1>Rent Accounts</h1>
  <p id="subtitle">rent · electricity · repairs</p>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<button class="fab" id="fab">+</button>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
const KEY='kirayakhata_v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || seed(); }catch(e){ return seed(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function seed(){ return { houses:[], rooms:[], tenants:[], entries:[], expenses:[], elecBills:[], elecReceipts:[], settings:{autoBackupEnabled:false,lastBackupDate:null} }; }
let DB = load();
DB.settings = DB.settings || {autoBackupEnabled:false, lastBackupDate:null};
DB.elecBills = DB.elecBills || []; DB.elecReceipts = DB.elecReceipts || [];
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

let tab = 'dash';
const tabsDef = [['dash','Dashboard'],['tenants','Tenants'],['electricity','Electricity'],['reports','Reports'],['fund','Repair Fund'],['archive','Archive'],['setup','Houses'],['names','Edit Names'],['backup','Backup'],['account','Account']];

// ---------- Google Sign-In + Drive sync ----------
// Replace with your own OAuth Client ID from Google Cloud Console (see setup guide).
const GOOGLE_CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com';
const DRIVE_FILE_NAME = 'rent-accounts-backup.json';
let driveToken = null, driveUser = null, driveFileId = null, tokenClient = null;

function initGoogle(){
  if(!window.google || !google.accounts || GOOGLE_CLIENT_ID.startsWith('YOUR_CLIENT_ID')) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.appdata email profile openid',
    callback: async (resp) => {
      if(resp.error){ return; }
      driveToken = resp.access_token;
      const info = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer '+driveToken}}).then(r=>r.json()).catch(()=>null);
      driveUser = info || {email:'signed in'};
      await checkDriveOnSignIn();
      render();
    }
  });
}
function driveSignIn(){
  if(!tokenClient){ initGoogle(); }
  if(!tokenClient){
    openModal(`<button class="close" onclick="closeModal()">×</button><h2>Not configured</h2><p style="font-size:13px;color:var(--red)">Google Sign-In needs a Client ID set up first — see the setup guide that came with this app.</p>`);
    return;
  }
  tokenClient.requestAccessToken({prompt:'consent'});
}
function driveSignOut(){
  if(driveToken) google.accounts.oauth2.revoke(driveToken, ()=>{});
  driveToken = null; driveUser = null; driveFileId = null;
  render();
}
async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}'`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name)`, {headers:{Authorization:'Bearer '+driveToken}}).then(r=>r.json());
  return (res.files && res.files[0]) ? res.files[0].id : null;
}
async function checkDriveOnSignIn(){
  driveFileId = await driveFindFile();
  if(driveFileId){
    const content = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {headers:{Authorization:'Bearer '+driveToken}}).then(r=>r.text());
    openModal(`<button class="close" onclick="closeModal()">×</button><h2>Data found in Drive</h2>
      <p style="font-size:13px;color:var(--ink-soft)">There's a backup in ${driveUser.email}'s Drive. Load it onto this device? This replaces what's currently here.</p>
      <button class="btn danger" onclick='loadFromDriveConfirmed(${JSON.stringify(content)})'>Load it</button>
      <button class="btn ghost" onclick="closeModal()">Not now — keep this device's data</button>`);
  }
}
function loadFromDriveConfirmed(content){
  try{
    const parsed = JSON.parse(content);
    DB = parsed;
    DB.settings = DB.settings || {autoBackupEnabled:false, lastBackupDate:null};
    DB.elecBills = DB.elecBills || []; DB.elecReceipts = DB.elecReceipts || [];
    save(); closeModal(); tab='dash'; render();
  }catch(e){}
}
async function saveToDrive(){
  if(!driveToken){ driveSignIn(); return; }
  const data = JSON.stringify(DB, null, 2);
  if(!driveFileId) driveFileId = await driveFindFile();
  if(driveFileId){
    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
      method:'PATCH', headers:{Authorization:'Bearer '+driveToken, 'Content-Type':'application/json'}, body:data
    });
  } else {
    const boundary = 'ratboundary';
    const meta = JSON.stringify({name:DRIVE_FILE_NAME, parents:['appDataFolder']});
    const body = `--${boundary}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${data}\r\n--${boundary}--`;
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method:'POST', headers:{Authorization:'Bearer '+driveToken, 'Content-Type':`multipart/related; boundary=${boundary}`}, body
    }).then(r=>r.json());
    driveFileId = res.id;
  }
  render();
}
function renderAccount(){
  if(GOOGLE_CLIENT_ID.startsWith('YOUR_CLIENT_ID')){
    return `<div class="card"><h3>Google Sign-In</h3>
      <p style="font-size:13px;color:var(--ink-soft)">Not set up yet. Follow the setup guide (setup-google-drive.md) that came with this app to create a free Google Cloud OAuth Client ID, then paste it into GOOGLE_CLIENT_ID near the top of the script in index.html.</p>
    </div>`;
  }
  if(!driveUser){
    return `<div class="card"><h3>Google Sign-In</h3>
      <p style="font-size:13px;color:var(--ink-soft)">Sign in to load your data on this device, or push what's on this device to your Drive so other devices can pull it.</p>
      <button class="btn" onclick="driveSignIn()">Sign in with Google</button>
    </div>`;
  }
  return `<div class="card"><h3>Signed in</h3>
    <div class="row"><span>Account</span><b>${driveUser.email||''}</b></div>
    <button class="btn" style="margin-top:10px" onclick="saveToDrive()">Save this device's data to Drive</button><br>
    <button class="btn ghost" onclick="checkDriveOnSignIn()">Check Drive for newer data</button><br>
    <button class="btn ghost" onclick="driveSignOut()">Sign out</button>
  </div>
  <div class="empty">Data is stored in a private file only this app can see in your Drive — it won't show up in your regular Drive folder list.</div>`;
}
window.addEventListener('load', ()=>{ setTimeout(initGoogle, 300); });
if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
let reportFilter = {houseId:'', from:'', to:''};

function render(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = tabsDef.map(([id,label])=>`<button data-t="${id}" class="${tab===id?'active':''}">${label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  const m = document.getElementById('main');
  if(tab==='dash') m.innerHTML = renderDash();
  if(tab==='tenants') m.innerHTML = renderTenants();
  if(tab==='electricity') m.innerHTML = renderElectricity();
  if(tab==='reports') m.innerHTML = renderReports();
  if(tab==='fund') m.innerHTML = renderFund();
  if(tab==='archive') m.innerHTML = renderArchive();
  if(tab==='setup') m.innerHTML = renderSetup();
  if(tab==='names') m.innerHTML = renderNames();
  if(tab==='backup') m.innerHTML = renderBackup();
  if(tab==='account') m.innerHTML = renderAccount();
  document.getElementById('fab').onclick = ()=> {
    if(tab==='setup') openHouseModal();
    else if(tab==='fund') openExpenseModal();
    else if(tab==='electricity') openElecPickerModal();
    else openTenantModal();
  };
  document.getElementById('fab').style.display = (tab==='archive'||tab==='names'||tab==='backup'||tab==='reports'||tab==='account') ? 'none' : 'block';
  wireRowClicks();
}

function activeTenants(){ return DB.tenants.filter(t=>t.status!=='vacated'); }
function roomName(id){ const r=DB.rooms.find(x=>x.id===id); return r?r.name:'—'; }
function houseOfRoom(id){ const r=DB.rooms.find(x=>x.id===id); return r?r.houseId:null; }
function houseName(id){ const h=DB.houses.find(x=>x.id===id); return h?h.name:'—'; }
function tenantEntries(tid){ return DB.entries.filter(e=>e.tenantId===tid).sort((a,b)=>b.date.localeCompare(a.date)); }

function tenantElecReceipts(tid){ return (DB.elecReceipts||[]).filter(x=>x.tenantId===tid).sort((a,b)=>b.date.localeCompare(a.date)); }

function houseElecTotals(houseId){
  const bills = (DB.elecBills||[]).filter(b=>b.houseId===houseId);
  const receipts = (DB.elecReceipts||[]).filter(x=>x.houseId===houseId);
  const billed = bills.reduce((s,b)=>s+Number(b.amount),0);
  const received = receipts.reduce((s,b)=>s+Number(b.amount),0);
  return { billed, received, profit: received-billed };
}

function renderDash(){
  const totRent = DB.entries.reduce((s,e)=>s+Number(e.rent||0),0);
  const totBilled = (DB.elecBills||[]).reduce((s,b)=>s+Number(b.amount),0);
  const totReceived = (DB.elecReceipts||[]).reduce((s,b)=>s+Number(b.amount),0);
  const totExp = DB.expenses.reduce((s,e)=>s+Number(e.amount),0);
  let html = `<div class="card"><h3>Total collected <span class="tag">all time</span></h3>
    <div class="big">₹${(totRent+totReceived).toLocaleString('en-IN')}</div>
    <hr class="divider">
    <div class="row"><span>Rent</span><b class="num">₹${totRent.toLocaleString('en-IN')}</b></div>
    <div class="row"><span>Electricity received from flats</span><b class="num">₹${totReceived.toLocaleString('en-IN')}</b></div>
    <div class="row"><span>Electricity actually billed</span><b class="num">₹${totBilled.toLocaleString('en-IN')}</b></div>
    <div class="row"><span>Electricity profit</span><b class="num pos">₹${(totReceived-totBilled).toLocaleString('en-IN')}</b></div>
    <div class="row"><span>Repairs spent</span><b class="num neg">₹${totExp.toLocaleString('en-IN')}</b></div>
    <div class="row"><span>Net repair fund</span><b class="num">₹${(totReceived-totBilled-totExp).toLocaleString('en-IN')}</b></div>
  </div>`;
  const activeSec = activeTenants();
  const totSecurity = activeSec.reduce((s,t)=>s+Number(t.security||0),0);
  html += `<div class="card"><h3>Security outstanding</h3>
    <div class="big">₹${totSecurity.toLocaleString('en-IN')}</div>
    <p style="font-size:12px;color:var(--ink-soft);margin:2px 0 8px">Held for ${activeSec.length} active tenant${activeSec.length!==1?'s':''} — refundable when they vacate.</p>
    ${activeSec.filter(t=>t.security>0).map(t=>`<div class="row"><span>${t.name} <span class="tag">${t.serial||''}</span></span><b class="num">₹${Number(t.security).toLocaleString('en-IN')}</b></div>`).join('') || '<div class="empty">No deposits on record.</div>'}
  </div>`;
  if(!DB.houses.length){
    html += `<div class="empty">No houses set up yet.<br>Go to "Houses" to add your first property and rooms.</div>`;
    return html;
  }
  html += DB.houses.map(h=>{
    const {profit} = houseElecTotals(h.id);
    const hExp = DB.expenses.filter(x=>x.houseId===h.id).reduce((s,e)=>s+Number(e.amount),0);
    const roomIds = DB.rooms.filter(r=>r.houseId===h.id).map(r=>r.id);
    const nTenants = DB.tenants.filter(t=>roomIds.includes(t.roomId)&&t.status!=='vacated').length;
    return `<div class="card"><h3>${h.name} <span class="tag">${nTenants} tenant${nTenants!==1?'s':''}</span></h3>
      <div class="row"><span>Electricity profit</span><b class="num pos">₹${profit.toLocaleString('en-IN')}</b></div>
      <div class="row"><span>Repairs spent</span><b class="num neg">₹${hExp.toLocaleString('en-IN')}</b></div>
      <div class="row"><span>Fund balance</span><b class="num">₹${(profit-hExp).toLocaleString('en-IN')}</b></div>
    </div>`;
  }).join('');
  return html;
}

function renderTenants(){
  const list = activeTenants();
  if(!DB.houses.length) return `<div class="empty">Add a house and room first, in the "Houses" tab.</div>`;
  if(!list.length) return `<div class="empty">No active tenants yet. Tap + to add one.</div>`;
  return list.map(t=>{
    const es = tenantEntries(t.id);
    const elecs = tenantElecReceipts(t.id);
    const lastRent = es[0]; const lastElec = elecs[0];
    return `<div class="card" data-tenant="${t.id}"><h3>${t.name} <span class="tag">${t.serial||'—'}</span></h3>
      <div class="row"><span>Room</span><b>${roomName(t.roomId)}</b></div>
      <div class="row"><span>House</span><b>${houseName(houseOfRoom(t.roomId))}</b></div>
      <div class="row"><span>Rent due</span><b>${t.dueDay||'—'}</b></div>
      <div class="row"><span>Security</span><b class="num">₹${Number(t.security||0).toLocaleString('en-IN')}</b></div>
      ${lastRent? `<div class="row"><span>Last rent (${lastRent.month})</span><b class="num">₹${Number(lastRent.rent).toLocaleString('en-IN')}</b></div>`:''}
      ${lastElec? `<div class="row"><span>Last electricity paid</span><b class="num">₹${Number(lastElec.amount).toLocaleString('en-IN')} on ${lastElec.date}</b></div>`:''}
    </div>`;
  }).join('');
}

function wireRowClicks(){
  document.querySelectorAll('[data-tenant]').forEach(el=>{
    el.onclick=()=>openTenantDetail(el.dataset.tenant);
  });
}

function renderElectricity(){
  if(!DB.houses.length) return `<div class="empty">Add a house first, in the "Houses" tab — each house has one electricity meter shared by its flats.</div>`;
  return DB.houses.map(h=>{
    const bills = (DB.elecBills||[]).filter(b=>b.houseId===h.id).sort((a,b)=>b.date.localeCompare(a.date));
    const receipts = (DB.elecReceipts||[]).filter(x=>x.houseId===h.id).sort((a,b)=>b.date.localeCompare(a.date));
    const totalBilled = bills.reduce((s,b)=>s+Number(b.amount),0);
    const totalReceived = receipts.reduce((s,b)=>s+Number(b.amount),0);
    const lastBill = bills[0];
    const lastPerUnit = lastBill && lastBill.units ? (lastBill.amount/lastBill.units).toFixed(2) : '—';
    return `<div class="card"><h3>${h.name}</h3>
      <div class="row"><span>Latest bill rate</span><b class="num">₹${lastPerUnit}/unit</b></div>
      <div class="row"><span>Total billed (meter)</span><b class="num">₹${totalBilled.toLocaleString('en-IN')}</b></div>
      <div class="row"><span>Total received (flats)</span><b class="num">₹${totalReceived.toLocaleString('en-IN')}</b></div>
      <div class="row"><span>Difference (profit)</span><b class="num pos">₹${(totalReceived-totalBilled).toLocaleString('en-IN')}</b></div>
      <div style="margin-top:8px">
        <button class="btn ghost" style="padding:6px 10px;margin:0 6px 0 0" onclick="openElecBillModal('${h.id}')">+ Bill</button>
        <button class="btn ghost" style="padding:6px 10px;margin:0" onclick="openElecReceiptModal('${h.id}')">+ Received</button>
      </div>
      ${bills.length||receipts.length? `<hr class="divider">
      ${bills.map(b=>`<div class="entryline row"><span>Bill · ${b.date}</span><b class="num">${b.units}u @ ₹${b.units?(b.amount/b.units).toFixed(2):'—'} = ₹${b.amount}</b></div>`).join('')}
      ${receipts.map(x=>`<div class="entryline row"><span>Received · ${x.date}${x.tenantName?' · '+x.tenantName:''}${x.linkedEntryId?' <span class="tag">auto</span>':''}</span><b class="num pos">₹${x.amount}</b></div>`).join('')}` : ''}
    </div>`;
  }).join('');
}
function openElecPickerModal(){
  if(!DB.houses.length){ openHouseModal(); return; }
  const opts = DB.houses.map(h=>`<option value="${h.id}">${h.name}</option>`).join('');
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>Add electricity record</h2>
    <label>House / meter</label><select id="epHouse">${opts}</select>
    <button class="btn" onclick="openElecBillModal(document.getElementById('epHouse').value)">+ Bill entry</button>
    <button class="btn ghost" onclick="openElecReceiptModal(document.getElementById('epHouse').value)">+ Received entry</button>`);
}
function openElecBillModal(houseId){
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New electricity bill</h2>
    <label>Bill date</label><input id="bDate" type="date">
    <label>Units used</label><input id="bUnits" type="number">
    <label>Bill amount (₹)</label><input id="bAmount" type="number">
    <p style="font-size:12px;color:var(--ink-soft)">Per-unit rate is calculated automatically once saved.</p>
    <button class="btn" onclick="saveElecBill('${houseId}')">Save bill</button>`);
}
function saveElecBill(houseId){
  DB.elecBills = DB.elecBills||[];
  DB.elecBills.push({id:uid(), houseId, date:document.getElementById('bDate').value,
    units:Number(document.getElementById('bUnits').value||0), amount:Number(document.getElementById('bAmount').value||0)});
  save(); closeModal(); tab='electricity'; render();
}
function openElecReceiptModal(houseId){
  const roomIds = DB.rooms.filter(r=>r.houseId===houseId).map(r=>r.id);
  const flats = DB.tenants.filter(t=>roomIds.includes(t.roomId)&&t.status!=='vacated');
  const opts = `<option value="">— not tied to a flat —</option>` + flats.map(t=>`<option value="${t.id}">${t.name} (${roomName(t.roomId)})</option>`).join('');
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>Electricity received</h2>
    <label>Date</label><input id="rDate" type="date">
    <label>Amount received (₹)</label><input id="rAmount" type="number">
    <label>From which flat (optional)</label><select id="rTenant">${opts}</select>
    <button class="btn" onclick="saveElecReceipt('${houseId}')">Save</button>`);

function inRange(dateStr, from, to){
  if(!dateStr) return false;
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}

let pendingImport = null;
function parseAndConfirmImport(text){
  try{
    const parsed = JSON.parse(text);
    if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.houses)) throw new Error('bad shape');
    pendingImport = parsed;
    openModal(`<button class="close" onclick="closeModal()">×</button><h2>Import backup?</h2>
      <p style="font-size:13px;color:var(--red)">This will replace ALL current data with this file: ${parsed.houses.length} houses, ${(parsed.tenants||[]).length} tenants, ${(parsed.entries||[]).length} rent entries. This cannot be undone.</p>
      <button class="btn danger" onclick="confirmImport()">Yes, replace all data</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>`);
  }catch(err){
    openModal(`<button class="close" onclick="closeModal()">×</button><h2>Import failed</h2>
      <p style="font-size:13px;color:var(--red)">That doesn't look like valid Rent Accounts backup JSON (from "Download full backup" above). Make sure you copied the whole file, starting with { and ending with }.</p>`);
  }
}
function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { parseAndConfirmImport(e.target.result); input.value=''; };
  reader.readAsText(file);
}
function importFromPastedText(){
  const text = document.getElementById('importText').value.trim();
  if(!text){ openModal(`<button class="close" onclick="closeModal()">×</button><h2>Nothing pasted</h2><p style="font-size:13px;color:var(--ink-soft)">Paste the backup JSON into the box first.</p>`); return; }
  parseAndConfirmImport(text);
}
function confirmImport(){
  if(!pendingImport) return;
  DB = pendingImport;
  DB.settings = DB.settings || {autoBackupEnabled:false, lastBackupDate:null};
  DB.elecBills = DB.elecBills || []; DB.elecReceipts = DB.elecReceipts || [];
  pendingImport = null;
  save(); closeModal(); tab='dash'; render();
}
function csvEscape(v){ return '"' + String(v??'').replace(/"/g,'""') + '"'; }
function buildCSV(){
  let rows = [['Serial','House','Room','Tenant','Status','Month','Date','Rent']];
  DB.entries.forEach(e=>{
    const t = DB.tenants.find(x=>x.id===e.tenantId); if(!t) return;
    rows.push([t.serial||'', houseName(houseOfRoom(t.roomId)), roomName(t.roomId), t.name, t.status, e.month, e.date, e.rent]);
  });
  rows.push([]); rows.push(['Electricity Meter (per house)']); rows.push(['House','Type','Date','Units','Amount','Per Unit / Flat']);
  (DB.elecBills||[]).forEach(b=> rows.push([houseName(b.houseId),'Bill',b.date,b.units,b.amount,b.units?(b.amount/b.units).toFixed(2):'']));
  (DB.elecReceipts||[]).forEach(x=> rows.push([houseName(x.houseId),'Received',x.date,'',x.amount,x.tenantName||'']));
  rows.push([]); rows.push(['Repair Expenses']); rows.push(['House','Date','Particular','Amount']);
  DB.expenses.forEach(x=> rows.push([houseName(x.houseId), x.date, x.particular, x.amount]));
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const filename = 'rent-accounts-backup-'+new Date().toISOString().slice(0,10)+'.csv';
  return {csv, filename};
}
async function downloadFile(filename, data){
  try{
    const downloads = await claude.use('downloads');
    if(downloads){ await downloads.save({filename, data}); return; }
  }catch(e){}
  const blob = new Blob([data], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
async function exportCSV(){
  const {csv, filename} = buildCSV();
  await downloadFile(filename, csv);
}
async function backupToDrive(){
  const {csv, filename} = buildCSV();
  await downloadFile(filename, csv);
  window.open('https://drive.google.com/drive/my-drive', '_blank');
}
function exportPDF(){
  const w = window.open('', '_blank');
  let body = `<h1>Rent Accounts — Backup</h1><p>${new Date().toLocaleDateString()}</p>`;
  DB.houses.forEach(h=>{

    const roomIds = DB.rooms.filter(r=>r.houseId===h.id).map(r=>r.id);
    DB.tenants.filter(t=>roomIds.includes(t.roomId)).forEach(t=>{
      body += `<h3>${t.serial||''} — ${t.name} (${roomName(t.roomId)}) — ${t.status}</h3><table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;font-size:12px">
        <tr><th>Month</th><th>Date</th><th>Rent</th></tr>`;
      tenantEntries(t.id).forEach(e=>{
        body += `<tr><td>${e.month}</td><td>${e.date}</td><td>₹${e.rent}</td></tr>`;
      });
      body += `</table>`;
      const elecs = tenantElecReceipts(t.id);
      if(elecs.length){
        body += `<table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;font-size:12px"><tr><th>Electricity paid</th><th>Amount</th></tr>`;
        elecs.forEach(x=> body += `<tr><td>${x.date}</td><td>₹${x.amount}</td></tr>`);
        body += `</table>`;
      }
    });
    const exps = DB.expenses.filter(x=>x.houseId===h.id);
    if(exps.length){
      body += `<h3>Repairs</h3><table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;font-size:12px"><tr><th>Date</th><th>Particular</th><th>Amount</th></tr>`;
      exps.forEach(x=> body += `<tr><td>${x.date}</td><td>${x.particular}</td><td>₹${x.amount}</td></tr>`);
      body += `</table>`;
    }
  });
  w.document.write(`<html><head><title>Rent Accounts Backup</title></head><body style="font-family:Georgia,serif">${body}</body></html>`);
  w.document.close(); w.focus();
  setTimeout(()=>w.print(), 400);
}

// ---------- Modals ----------
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('modalBg').classList.add('open'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').onclick = e=>{ if(e.target.id==='modalBg') closeModal(); };

function openHouseModal(){
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New house</h2>
    <label>House name</label><input id="hName" placeholder="e.g. Chimni Mill">
    <label>Initial (short code for tenant serial numbers)</label><input id="hInitial" placeholder="e.g. CM">
    <button class="btn" onclick="saveHouse()">Save house</button>`);
}
function saveHouse(){
  const name = document.getElementById('hName').value.trim();
  if(!name) return;
  const initial = document.getElementById('hInitial').value.trim().toUpperCase() || name.slice(0,2).toUpperCase();
  DB.houses.push({id:uid(), name, initial, tenantCounter:0}); save(); closeModal(); render();
}

function openRoomModal(houseId){
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New room</h2>
    <label>Room name</label><input id="rName" placeholder="e.g. Window room">
    <button class="btn" onclick="saveRoom('${houseId}')">Save room</button>`);
}
function saveRoom(houseId){
  const name = document.getElementById('rName').value.trim();
  if(!name) return;
  DB.rooms.push({id:uid(), houseId, name}); save(); closeModal(); render();
}

function openTenantModal(){
  if(!DB.rooms.length){ openHouseModal(); return; }
  const roomOpts = DB.rooms.map(r=>`<option value="${r.id}">${r.name} — ${houseName(r.houseId)}</option>`).join('');
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New tenant</h2>
    <label>Name</label><input id="tName">
    <label>Room</label><select id="tRoom">${roomOpts}</select>
    <label>Security deposit (₹)</label><input id="tSecurity" type="number">
    <label>Rent due date</label><input id="tDue" placeholder="e.g. 1st of every month">
    <label>Move-in date</label><input id="tMoveIn" type="date">
    <button class="btn" onclick="saveTenant()">Save tenant</button>`);
}
function saveTenant(){
  const name=document.getElementById('tName').value.trim();
  if(!name) return;
  const roomId = document.getElementById('tRoom').value;
  const house = DB.houses.find(x=>x.id===houseOfRoom(roomId));
  house.tenantCounter = (house.tenantCounter||0) + 1;
  const serial = `${house.initial||'T'}-${house.tenantCounter}`;
  DB.tenants.push({id:uid(), serial, name, roomId,
    security:document.getElementById('tSecurity').value||0, dueDay:document.getElementById('tDue').value,
    moveIn:document.getElementById('tMoveIn').value, status:'active'});
  save(); closeModal(); render();
}

function openTenantDetail(tid){
  const t = DB.tenants.find(x=>x.id===tid);
  const es = tenantEntries(tid);
  const elecs = tenantElecReceipts(tid);
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>${t.name} <span class="tag">${t.serial||'—'}</span></h2>
    <p style="color:var(--ink-soft);font-family:'Space Mono',monospace;font-size:12px">${roomName(t.roomId)} · ${houseName(houseOfRoom(t.roomId))}${t.phone?' · '+t.phone:''}</p>
    <div class="row"><span>Security held</span><b class="num">₹${Number(t.security||0).toLocaleString('en-IN')}</b></div>
    ${t.notes? `<div class="row" style="display:block"><span>Notes</span><div style="margin-top:3px">${t.notes}</div></div>`:''}
    ${t.verificationLink? `<div class="row"><span>Verification</span><a href="${t.verificationLink}" target="_blank" style="color:var(--accent)">Open link</a></div>`:''}
    ${t.agreementLink? `<div class="row"><span>Rent agreement</span><a href="${t.agreementLink}" target="_blank" style="color:var(--accent)">Open link</a></div>`:''}
    <div style="margin-top:10px">
      <button class="btn" onclick="openRentModal('${tid}')">+ Add rent</button>
      <button class="btn ghost" onclick="openTenantElecModal('${tid}')">+ Add electricity payment</button><br>
      <button class="btn ghost" onclick="editTenant('${tid}')">Edit details / notes / links</button>
      ${t.status!=='vacated'? `<button class="btn ghost" onclick="openVacateModal('${tid}')">Mark vacated</button>`:''}
    </div>
    <hr class="divider">
    <h3 style="font-size:13px">Rent history</h3>
    ${es.map(e=>`<div class="entryline row"><span>${e.month} · ${e.date}</span><b class="num">₹${Number(e.rent).toLocaleString('en-IN')}</b></div>`).join('') || '<div class="empty">No rent entries yet.</div>'}
    <h3 style="font-size:13px;margin-top:14px">Electricity payments</h3>
    ${elecs.map(x=>`<div class="entryline row"><span>${x.date}</span><b class="num">₹${Number(x.amount).toLocaleString('en-IN')}</b></div>`).join('') || '<div class="empty">No electricity payments yet.</div>'}`);
}

function openRentModal(tid){
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New rent entry</h2>
    <label>Month (e.g. Sep 2026)</label><input id="eMonth">
    <label>Rent received date</label><input id="eDate" type="date">
    <label>Rent received (₹)</label><input id="eRent" type="number">
    <button class="btn" onclick="saveRentEntry('${tid}')">Save rent</button>`);
}
function saveRentEntry(tid){
  DB.entries.push({id:uid(), tenantId:tid, month:document.getElementById('eMonth').value,
    date:document.getElementById('eDate').value, rent:Number(document.getElementById('eRent').value||0)});
  save(); render(); openTenantDetail(tid);
}

function openTenantElecModal(tid){
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>Electricity payment</h2>
    <p style="font-size:12px;color:var(--ink-soft)">This logs into the house's Electricity tab automatically, tagged with ${DB.tenants.find(x=>x.id===tid).name}'s name.</p>
    <label>Date tenant paid</label><input id="teDate" type="date">
    <label>Amount received (₹)</label><input id="teAmount" type="number">
    <button class="btn" onclick="saveTenantElec('${tid}')">Save payment</button>`);
}
function saveTenantElec(tid){
  const t = DB.tenants.find(x=>x.id===tid);
  DB.elecReceipts = DB.elecReceipts||[];
  DB.elecReceipts.push({id:uid(), houseId:houseOfRoom(t.roomId), tenantId:tid, tenantName:t.name,
    date:document.getElementById('teDate').value, amount:Number(document.getElementById('teAmount').value||0)});
  save(); render(); openTenantDetail(tid);
}

function openVacateModal(tid){
  const t = DB.tenants.find(x=>x.id===tid);
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>Mark vacated</h2>
    <label>Move-out date</label><input id="vDate" type="date">
    <label>Security held (₹)</label><input id="vSecAmount" type="number" value="${t.security||0}">
    <label>How is the security settled?</label>
    <select id="vSecType">
      <option value="cash">Returned in cash / bank transfer</option>
      <option value="rent">Adjusted against rent</option>
      <option value="electricity">Adjusted against electricity</option>
      <option value="none">Nothing to settle (already handled)</option>
    </select>
    <button class="btn danger" onclick="vacate('${tid}')">Confirm — move to archive</button>`);
}
function vacate(tid){
  const t = DB.tenants.find(x=>x.id===tid);
  const moveOut = document.getElementById('vDate').value;
  const secType = document.getElementById('vSecType').value;
  const secAmount = Number(document.getElementById('vSecAmount').value||0);
  if(secAmount>0 && secType==='rent'){
    DB.entries.push({id:uid(), tenantId:tid, month:'Security adjustment', date:moveOut, rent:secAmount});
  } else if(secAmount>0 && secType==='electricity'){
    DB.elecReceipts = DB.elecReceipts||[];
    DB.elecReceipts.push({id:uid(), houseId:houseOfRoom(t.roomId), tenantId:tid, tenantName:t.name, date:moveOut, amount:secAmount});
  }
  t.securitySettlement = {type:secType, amount:secAmount, date:moveOut};
  t.status='vacated'; t.moveOut = moveOut;
  save(); closeModal(); tab='archive'; render();
}

function openExpenseModal(){
  if(!DB.houses.length){ openHouseModal(); return; }
  const opts = DB.houses.map(h=>`<option value="${h.id}">${h.name}</option>`).join('');
  openModal(`<button class="close" onclick="closeModal()">×</button><h2>New repair expense</h2>
    <label>House</label><select id="xHouse">${opts}</select>
    <label>Date</label><input id="xDate" type="date">
    <label>Particular</label><input id="xPart" placeholder="e.g. Water motor">
    <label>Amount (₹)</label><input id="xAmt" type="number">
    <button class="btn" onclick="saveExpense()">Save expense</button>`);
}
function saveExpense(){
  DB.expenses.push({id:uid(), houseId:document.getElementById('xHouse').value, date:document.getElementById('xDate').value,
    particular:document.getElementById('xPart').value, amount:Number(document.getElementById('xAmt').value||0)});
  save(); closeModal(); render();
}

render();

function checkAutoBackup(){
  const s = DB.settings;
  if(!s || !s.autoBackupEnabled) return;
  const today = new Date().toISOString().slice(0,10);
  if(s.lastBackupDate === today) return;
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const wifiOk = (conn && conn.type) ? conn.type==='wifi' : true;
  if(!wifiOk) return;
  const {csv, filename} = buildCSV();
  downloadFile(filename, csv);
  s.lastBackupDate = today;
  save();
}
checkAutoBackup();

// Swipe between tabs
(function(){
  const el = document.getElementById('main');
  let sx=0, sy=0;
  el.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5 && !document.getElementById('modalBg').classList.contains('open')){
      const i = tabsDef.findIndex(t=>t[0]===tab);
      if(dx < 0 && i < tabsDef.length-1){ tab = tabsDef[i+1][0]; render(); }
      if(dx > 0 && i > 0){ tab = tabsDef[i-1][0]; render(); }
    }
  }, {passive:true});
})();
</script>
